<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareFood - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
        }
        header {
            background-color: #2e7d32;
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
        }
        nav {
            margin-top: 1rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            padding: 5px 15px;
            background-color: #1b5e20;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #388e3c;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #f4f4f4;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 5px;
        }
        .btn {
            display: inline-block;
            background-color: #2e7d32;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to ShareFood</h1>
        <p>Sharing food, reducing waste, and building community.</p>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'listings:list' %}">View Listings</a>
        </nav>
    </header>
    <main>
        <div class="card">
            <h2>About Our Project</h2>
            <p>ShareFood connects people who have extra food with those who need it. Explore our available listings to discover food sharing in your area.</p>
            <a href="/listings/" class="btn">View Listings</a>
        </div>
    </main>
</body>
</html>
